# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS and the version of Python (pandoc is needed by nbsphinx)
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc

# Build documentation in the sphinx_source/ directory with Sphinx
sphinx:
  configuration: sphinx_source/conf.py

# Optionally build your docs in additional formats such as PDF and ePub
formats: all

# Requirements to build the docs and installation of the package
python:
  install:
    - requirements: sphinx_source/requirements.txt
    - method: pip
      path: .
